plugins {
    id 'java-library'
    id 'io.qameta.allure' version '3.0.0'
}

group = 'ru.svyaznoy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

allure {
    report {
        version.set('2.25.0')
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set('2.25.0')
            }
        }
    }
}

dependencies {
    testImplementation(
            'com.codeborne:selenide:7.2.1',
            'org.junit.jupiter:junit-jupiter:5.10.1',
            'io.qameta.allure:allure-junit5:2.25.0',
            'io.qameta.allure:allure-selenide:2.25.0',
            'org.slf4j:slf4j-simple:2.0.7'
    )
}

def configureTestTask = { Test task, String tag ->
    task.useJUnitPlatform {
        includeTags(tag)
    }
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.systemProperty 'baseUrl', System.getProperty('baseUrl', '')
    task.systemProperty 'remoteUrl', System.getProperty('remoteUrl', System.getenv('REMOTE_URL') ?: '')
    task.systemProperty 'browser', System.getProperty('browser', '')
    task.systemProperty 'browserSize', System.getProperty('browserSize', '')
    task.systemProperty 'timeout', System.getProperty('timeout', '')
    task.systemProperty 'selenoidVideoUrl', System.getProperty('selenoidVideoUrl', '')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'baseUrl', System.getProperty('baseUrl', '')
    systemProperty 'remoteUrl', System.getProperty('remoteUrl', System.getenv('REMOTE_URL') ?: '')
    systemProperty 'browser', System.getProperty('browser', '')
    systemProperty 'browserSize', System.getProperty('browserSize', '')
    systemProperty 'timeout', System.getProperty('timeout', '')
    systemProperty 'selenoidVideoUrl', System.getProperty('selenoidVideoUrl', '')

    testLogging {
        lifecycle {
            events 'started', 'skipped', 'failed', 'standard_error', 'standard_out'
            exceptionFormat 'short'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('smoke_test', Test) {
    configureTestTask(it, 'smoke')
}

tasks.register('regression_test', Test) {
    configureTestTask(it, 'regression')
}

tasks.register('copyAllureResults', Copy) {
    dependsOn test
    from layout.buildDirectory.dir('allure-results')
    into layout.projectDirectory.dir('allure-results')
}
